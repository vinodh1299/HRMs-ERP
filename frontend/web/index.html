<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ACA Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACA Portal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    var _currentSpeechEndCallback = null;

    window.startSpeechRecognition = function(onResult, onError, onEnd) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (onError) onError("Speech recognition not supported in this browser.");
        if (onEnd) onEnd();
        return null;
      }
      var recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        var text = event.results[0][0].transcript;
        if (onResult) onResult(text);
      };
      recognition.onerror = function(event) {
        if (onError) onError(event.error || "Speech recognition error");
      };
      recognition.onend = function() {
        if (onEnd) onEnd();
      };
      try {
        recognition.start();
      } catch (e) {
        if (onError) onError(e.message || "Failed to start speech recognition");
        if (onEnd) onEnd();
      }
      return recognition;
    };

    window.speakText = function(text, onStart, onEnd) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var cleanText = String(text)
        .replace(/[\#\*\_\`\~]/g, '')
        .replace(/🚀|📅|⏰|📢|👥|💰|🎓|🍳|💻|📹|🛠️|📋|🎫|ℹ️|✅|❌|👋|⚠️|🚫/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      if (!cleanText) {
        if (onEnd) onEnd();
        return;
      }

      var utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.lang = 'en-US';

      utterance.onstart = function() {
        if (onStart) onStart();
      };
      utterance.onend = function() {
        if (onEnd) onEnd();
      };
      utterance.onerror = function(e) {
        if (onEnd) onEnd();
      };

      _currentSpeechEndCallback = onEnd;
      window.speechSynthesis.speak(utterance);
    };

    window.stopSpeaking = function() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        if (_currentSpeechEndCallback) {
          _currentSpeechEndCallback();
          _currentSpeechEndCallback = null;
        }
      }
    };

    window.isSpeaking = function() {
      return ('speechSynthesis' in window) && window.speechSynthesis.speaking;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
