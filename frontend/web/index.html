<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Asian Christian Academy HRMS Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ACA Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACA Portal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    var _currentSpeechEndCallback = null;
    var _activeRecognition = null;
    var _isContinuousListening = false;
    var _audioCtx = null;
    var _currentAudioPlayer = null;

    // Web Audio API Audio Chime Generator
    function playAudioChime() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!_audioCtx) _audioCtx = new AudioCtx();
        if (_audioCtx.state === 'suspended') {
          _audioCtx.resume();
        }
        var osc = _audioCtx.createOscillator();
        var gain = _audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, _audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, _audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(_audioCtx.destination);
        osc.start();
        osc.stop(_audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    // Force voice initialization on page load
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.getVoices(); } catch(e){}
      window.speechSynthesis.onvoiceschanged = function() {
        try { window.speechSynthesis.getVoices(); } catch(e){}
      };
    }

    // Explicit Microphone Permission Request Helper
    window.requestMicrophonePermission = function() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            console.log("[Microphone Permission Granted]");
            stream.getTracks().forEach(function(track) { track.stop(); });
          })
          .catch(function(err) {
            console.warn("[Microphone Permission Denied]:", err);
          });
      }
    };

    // Speech Recognition Helper — ONLY processes COMPLETE FINAL transcripts
    window.startSpeechRecognition = function(onResult, onError, onEnd, continuous) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (onError) onError("Speech recognition not supported in this browser.");
        if (onEnd) onEnd();
        return null;
      }

      _isContinuousListening = !!continuous;

      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
        _activeRecognition = null;
      }

      var recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        for (var i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal || event.results[i][0].confidence > 0.5) {
            var transcript = event.results[i][0].transcript.trim();
            if (transcript && transcript.length > 1) {
              console.log("[SpeechRecognition Final Transcript]:", transcript);
              if (onResult) onResult(transcript);
            }
          }
        }
      };

      recognition.onerror = function(event) {
        console.warn("[SpeechRecognition Error]:", event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          window.requestMicrophonePermission();
        }
        if (onError) onError(event.error || "Speech recognition error");
      };

      recognition.onend = function() {
        console.log("[SpeechRecognition Ended]");
        if (onEnd) onEnd();
        if (_isContinuousListening && _activeRecognition === recognition) {
          setTimeout(function() {
            try { recognition.start(); } catch(e){}
          }, 300);
        }
      };

      try {
        recognition.start();
        _activeRecognition = recognition;
        console.log("[SpeechRecognition Started Successfully]");
      } catch (e) {
        console.error("[SpeechRecognition Start Exception]:", e);
        if (onError) onError(e.message || "Failed to start speech recognition");
        if (onEnd) onEnd();
      }
      return recognition;
    };

    window.stopSpeechRecognition = function() {
      _isContinuousListening = false;
      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
        _activeRecognition = null;
      }
    };

    // ElevenLabs High-Clarity Voice Synthesis Routine
    window.speakText = function(text, onStart, onEnd) {
      var cleanText = String(text)
        .replace(/[\#\*\_\`\~]/g, '')
        .replace(/🚀|📅|⏰|📢|👥|💰|🎓|🍳|💻|📹|🛠️|📋|🎫|ℹ️|✅|❌|👋|⚠️|🚫|🎙️|🔊|🏠|⚙️|💬|📧|🤖/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      if (!cleanText) {
        if (onEnd) onEnd();
        return;
      }

      playAudioChime();

      if (_currentAudioPlayer) {
        try { _currentAudioPlayer.pause(); } catch(e){}
        _currentAudioPlayer = null;
      }

      // 1. Try ElevenLabs API endpoint first for ultra-realistic male voice
      fetch('http://localhost:3001/api/ai/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleanText })
      })
      .then(function(res) {
        if (res.headers.get('content-type')?.includes('audio/mpeg')) {
          return res.blob().then(function(blob) {
            var url = URL.createObjectURL(blob);
            var audio = new Audio(url);
            _currentAudioPlayer = audio;
            audio.onplay = function() { if (onStart) onStart(); };
            audio.onended = function() { if (onEnd) onEnd(); };
            audio.onerror = function() { fallbackWebSpeech(cleanText, onStart, onEnd); };
            audio.play();
          });
        } else {
          fallbackWebSpeech(cleanText, onStart, onEnd);
        }
      })
      .catch(function() {
        fallbackWebSpeech(cleanText, onStart, onEnd);
      });
    };

    // Fallback WebSpeech Synthesis with Deep Male Tone
    function fallbackWebSpeech(cleanText, onStart, onEnd) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }

      try { window.speechSynthesis.cancel(); } catch(e){}

      setTimeout(function() {
        try {
          var utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.volume = 1.0;
          utterance.rate = 1.0;
          utterance.pitch = 0.85; // Clear deep male voice tone
          utterance.lang = 'en-US';

          utterance.onstart = function() {
            console.log("[SpeechSynthesis Started]:", cleanText);
            if (onStart) onStart();
          };
          utterance.onend = function() {
            console.log("[SpeechSynthesis Ended]");
            if (onEnd) onEnd();
          };
          utterance.onerror = function(e) {
            console.warn("[SpeechSynthesis Error]:", e);
            if (onEnd) onEnd();
          };

          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }

          window.speechSynthesis.speak(utterance);
        } catch(err) {
          console.error("[SpeechSynthesis Exception]:", err);
          if (onEnd) onEnd();
        }
      }, 50);
    }

    window.stopSpeaking = function() {
      if (_currentAudioPlayer) {
        try { _currentAudioPlayer.pause(); } catch(e){}
        _currentAudioPlayer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (_currentSpeechEndCallback) {
        _currentSpeechEndCallback();
        _currentSpeechEndCallback = null;
      }
    };

    window.isSpeaking = function() {
      return (_currentAudioPlayer && !_currentAudioPlayer.paused) ||
             (('speechSynthesis' in window) && window.speechSynthesis.speaking);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
