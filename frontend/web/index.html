<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Asian Christian Academy HRMS Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ACA Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACA Portal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    var _currentSpeechEndCallback = null;
    var _activeRecognition = null;
    var _isContinuousListening = false;
    var _audioCtx = null;

    // Web Audio API Audio Chime Generator to guarantee audible feedback
    function playAudioChime() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!_audioCtx) _audioCtx = new AudioCtx();
        if (_audioCtx.state === 'suspended') {
          _audioCtx.resume();
        }
        var osc = _audioCtx.createOscillator();
        var gain = _audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, _audioCtx.currentTime); // D5 note
        gain.gain.setValueAtTime(0.15, _audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(_audioCtx.destination);
        osc.start();
        osc.stop(_audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    // Force voice initialization on page load
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.getVoices(); } catch(e){}
      window.speechSynthesis.onvoiceschanged = function() {
        try { window.speechSynthesis.getVoices(); } catch(e){}
      };
    }

    // Explicit Microphone Permission Request Helper
    window.requestMicrophonePermission = function() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            console.log("[Microphone Permission Granted]");
            stream.getTracks().forEach(function(track) { track.stop(); });
          })
          .catch(function(err) {
            console.warn("[Microphone Permission Denied]:", err);
          });
      }
    };

    // Speech Recognition Helper
    window.startSpeechRecognition = function(onResult, onError, onEnd, continuous) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (onError) onError("Speech recognition not supported in this browser.");
        if (onEnd) onEnd();
        return null;
      }

      _isContinuousListening = !!continuous;

      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
        _activeRecognition = null;
      }

      var recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        transcript = transcript.trim();
        if (transcript) {
          console.log("[SpeechRecognition Live Transcript]:", transcript);
          if (onResult) onResult(transcript);
        }
      };

      recognition.onerror = function(event) {
        console.warn("[SpeechRecognition Error]:", event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          window.requestMicrophonePermission();
        }
        if (onError) onError(event.error || "Speech recognition error");
      };

      recognition.onend = function() {
        console.log("[SpeechRecognition Ended]");
        if (onEnd) onEnd();
        if (_isContinuousListening && _activeRecognition === recognition) {
          setTimeout(function() {
            try { recognition.start(); } catch(e){}
          }, 300);
        }
      };

      try {
        recognition.start();
        _activeRecognition = recognition;
        console.log("[SpeechRecognition Started Successfully]");
      } catch (e) {
        console.error("[SpeechRecognition Start Exception]:", e);
        if (onError) onError(e.message || "Failed to start speech recognition");
        if (onEnd) onEnd();
      }
      return recognition;
    };

    window.stopSpeechRecognition = function() {
      _isContinuousListening = false;
      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
        _activeRecognition = null;
      }
    };

    // High-Quality Male Voice Synthesis Routine
    window.speakText = function(text, onStart, onEnd) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }

      playAudioChime();

      var cleanText = String(text)
        .replace(/[\#\*\_\`\~]/g, '')
        .replace(/🚀|📅|⏰|📢|👥|💰|🎓|🍳|💻|📹|🛠️|📋|🎫|ℹ️|✅|❌|👋|⚠️|🚫|🎙️|🔊|🏠|⚙️|💬|📧|🤖/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      if (!cleanText) {
        if (onEnd) onEnd();
        return;
      }

      try { window.speechSynthesis.cancel(); } catch(e){}

      setTimeout(function() {
        try {
          var utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.volume = 1.0;
          utterance.rate = 1.0;
          utterance.pitch = 0.85; // Clear deep male voice tone
          utterance.lang = 'en-US';

          utterance.onstart = function() {
            console.log("[SpeechSynthesis Started]:", cleanText);
            if (onStart) onStart();
          };
          utterance.onend = function() {
            console.log("[SpeechSynthesis Ended]");
            if (onEnd) onEnd();
          };
          utterance.onerror = function(e) {
            console.warn("[SpeechSynthesis Error]:", e);
            if (onEnd) onEnd();
          };

          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }

          window.speechSynthesis.speak(utterance);
        } catch(err) {
          console.error("[SpeechSynthesis Exception]:", err);
          if (onEnd) onEnd();
        }
      }, 50);
    };

    window.stopSpeaking = function() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        if (_currentSpeechEndCallback) {
          _currentSpeechEndCallback();
          _currentSpeechEndCallback = null;
        }
      }
    };

    window.isSpeaking = function() {
      return ('speechSynthesis' in window) && window.speechSynthesis.speaking;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
