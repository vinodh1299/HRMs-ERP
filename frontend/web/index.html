<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Asian Christian Academy HRMS Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ACA Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACA Portal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    var _currentSpeechEndCallback = null;
    var _activeRecognition = null;

    // Speech Recognition Helper
    window.startSpeechRecognition = function(onResult, onError, onEnd, continuous) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (onError) onError("Speech recognition not supported in this browser.");
        if (onEnd) onEnd();
        return null;
      }

      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
      }

      var recognition = new SpeechRecognition();
      recognition.continuous = !!continuous;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        var lastResultIndex = event.results.length - 1;
        var text = event.results[lastResultIndex][0].transcript;
        if (onResult) onResult(text);
      };
      recognition.onerror = function(event) {
        if (onError) onError(event.error || "Speech recognition error");
      };
      recognition.onend = function() {
        if (onEnd) onEnd();
      };

      try {
        recognition.start();
        _activeRecognition = recognition;
      } catch (e) {
        if (onError) onError(e.message || "Failed to start speech recognition");
        if (onEnd) onEnd();
      }
      return recognition;
    };

    window.stopSpeechRecognition = function() {
      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e){}
        _activeRecognition = null;
      }
    };

    // Preferred Male Voice Selection Routine for "Mark"
    function getBestMaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      var voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      // Priority list for natural male voices
      var maleKeywords = ['male', 'daniel', 'alex', 'oliver', 'george', 'david', 'arthur', 'ryan', 'aaron', 'google uk english male', 'google us english male'];
      
      for (var i = 0; i < maleKeywords.length; i++) {
        var kw = maleKeywords[i];
        var found = voices.find(function(v) {
          return v.name.toLowerCase().includes(kw) && v.lang.startsWith('en');
        });
        if (found) return found;
      }

      // Secondary fallback to English voice
      return voices.find(function(v) { return v.lang.startsWith('en'); }) || voices[0];
    }

    // Ensure voices are loaded
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function() {
        getBestMaleVoice();
      };
    }

    // High-Quality Male Voice Synthesis Routine
    window.speakText = function(text, onStart, onEnd) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      var cleanText = String(text)
        .replace(/[\#\*\_\`\~]/g, '')
        .replace(/🚀|📅|⏰|📢|👥|💰|🎓|🍳|💻|📹|🛠️|📋|🎫|ℹ️|✅|❌|👋|⚠️|🚫|🎙️|🔊/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      if (!cleanText) {
        if (onEnd) onEnd();
        return;
      }

      var utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 0.9; // Clear, deep male voice tone
      utterance.lang = 'en-US';

      var maleVoice = getBestMaleVoice();
      if (maleVoice) {
        utterance.voice = maleVoice;
      }

      utterance.onstart = function() {
        if (onStart) onStart();
      };
      utterance.onend = function() {
        if (onEnd) onEnd();
      };
      utterance.onerror = function(e) {
        if (onEnd) onEnd();
      };

      _currentSpeechEndCallback = onEnd;
      window.speechSynthesis.speak(utterance);
    };

    window.stopSpeaking = function() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        if (_currentSpeechEndCallback) {
          _currentSpeechEndCallback();
          _currentSpeechEndCallback = null;
        }
      }
    };

    window.isSpeaking = function() {
      return ('speechSynthesis' in window) && window.speechSynthesis.speaking;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
